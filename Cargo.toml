[package]
name = "codex-workspace-mcp"
version = "0.2.1"
edition = "2024"

[features]
vm-measurements = []

[[bin]]
name = "vm-measurements"
path = "src/runtime/vm_measurements.rs"
required-features = ["vm-measurements"]

[dependencies]
getrandom = "0.4.2"
tower-http = { version = "0.6.11", features = ["cors", "fs", "trace"] }
axum = { version = "0.8.9", features = ["ws"] }
russh = { version = "0.61", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
ignore = "0.4.25"
regex = "1.12.2"
fancy-regex = "0.19"
icu_collator = { version = "=2.2.0", features = ["compiled_data"] }
icu_locale = "=2.2.0"
swc_common = "21.0.2"
swc_ecma_ast = "23.0.1"
swc_ecma_parser = "39.1.0"
swc_ecma_visit = "23.0.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0.102"
chrono = "0.4.42"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["rt", "io"] }
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
mime_guess = "2.0.5"
reqwest = { version = "0.12.26", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
url = "2.5.8"

futures = "0.3"
tree-sitter = "0.25.8"
tree-sitter-go = "0.25.0"
syn = { version = "2.0.117", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.45"
rustpython-parser = { version = "0.4.0", default-features = false, features = ["num-bigint"] }
rusqlite = { version = "0.33.0", features = ["bundled"] }
base64 = "0.22.1"
sha2 = "0.10.9"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
jsonschema = { version = "0.60.2", default-features = false }
htmd = "0.5.6"

[dev-dependencies]
rand = "0.10"
tokio-tungstenite = "0.29"
tokio = { version = "1.52.3", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
tempfile = "3"
